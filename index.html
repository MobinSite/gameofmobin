<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>داش مبین</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #000;
    color: #00ff41;
    font-family: Consolas, monospace;
}

/* =========================
   صفحه اصلی
========================= */

#home {
    width: 100%;
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    background:
        radial-gradient(
            circle,
            #102010 0%,
            #020502 45%,
            #000 80%
        );
}

.main-box {
    text-align: center;

    padding: 50px;

    border: 1px solid #00ff41;
    border-radius: 20px;

    background: rgba(0,0,0,0.8);

    box-shadow:
        0 0 20px #00ff41,
        inset 0 0 30px rgba(0,255,65,0.1);
}

.title {
    font-size: 65px;

    color: #00ff41;

    text-shadow:
        0 0 10px #00ff41,
        0 0 30px #00ff41,
        0 0 60px #00ff41;

    margin-bottom: 15px;
}

.subtitle {
    color: #aaa;
    font-size: 18px;
    margin-bottom: 35px;
}

#secretBtn {
    padding: 15px 50px;

    background: transparent;

    border: 2px solid #00ff41;
    border-radius: 10px;

    color: #00ff41;

    font-family: monospace;
    font-size: 22px;

    cursor: pointer;

    transition: 0.3s;
}

#secretBtn:hover {
    background: #00ff41;
    color: #000;

    box-shadow:
        0 0 15px #00ff41,
        0 0 40px #00ff41;

    transform: scale(1.08);
}


/* =========================
   صفحه هکری
========================= */

#hackPage {
    display: none;

    position: relative;

    width: 100%;
    height: 100vh;

    background: #000;

    overflow: hidden;
}

#matrix {
    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;
}


/* =========================
   فلش قرمز
========================= */

#redFlash {
    position: absolute;

    inset: 0;

    background: red;

    opacity: 0;

    pointer-events: none;

    z-index: 20;
}


/* =========================
   محتوای وسط
========================= */

#center {
    position: absolute;

    inset: 0;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    z-index: 10;

    text-align: center;

    pointer-events: none;
}


/* =========================
   درصد هک
========================= */

#percent {
    font-size: 55px;

    margin-bottom: 20px;

    text-shadow:
        0 0 10px #00ff41,
        0 0 30px #00ff41;
}


/* =========================
   متن HACKING
========================= */

#status {
    font-size: 24px;

    margin-bottom: 20px;
}


/* =========================
   نوار پیشرفت
========================= */

.progress-container {
    width: 500px;
    max-width: 80vw;

    height: 18px;

    border: 1px solid #00ff41;

    background: #001000;

    box-shadow:
        0 0 10px #00ff41;
}

#progress {
    width: 0%;

    height: 100%;

    background: #00ff41;

    box-shadow:
        0 0 15px #00ff41;

    transition: width 0.1s;
}


/* =========================
   ترمینال
========================= */

#terminal {
    position: absolute;

    left: 30px;
    bottom: 30px;

    width: 450px;
    max-width: 85vw;

    height: 180px;

    padding: 15px;

    border: 1px solid #00ff41;

    background: rgba(0,0,0,0.85);

    box-shadow:
        0 0 15px rgba(0,255,65,0.3);

    overflow: hidden;

    font-size: 13px;

    z-index: 15;
}

.terminal-line {
    margin-bottom: 7px;
}


/* =========================
   YOU HACKED
========================= */

#hacked {
    display: none;

    position: absolute;

    inset: 0;

    z-index: 30;

    justify-content: center;
    align-items: center;

    flex-direction: column;

    background: rgba(0,0,0,0.45);
}

#hacked h1 {

    color: red;

    font-size: 80px;

    text-shadow:
        0 0 10px red,
        0 0 30px red,
        0 0 60px red;

    animation: glitch 0.15s infinite;
}

#joke {

    margin-top: 25px;

    font-size: 40px;

    color: #00ff41;

    text-shadow:
        0 0 15px #00ff41;

    display: none;
}


/* =========================
   دکمه برگشت
========================= */

#back {

    margin-top: 30px;

    padding: 12px 35px;

    color: white;

    background: black;

    border: 1px solid white;

    border-radius: 8px;

    font-family: monospace;

    cursor: pointer;

    display: none;
}

#back:hover {
    background: white;
    color: black;
}


/* =========================
   انیمیشن Glitch
========================= */

@keyframes glitch {

    0% {
        transform: translate(0);
    }

    20% {
        transform: translate(-5px, 3px);
    }

    40% {
        transform: translate(5px, -3px);
    }

    60% {
        transform: translate(-3px, -2px);
    }

    80% {
        transform: translate(3px, 2px);
    }

    100% {
        transform: translate(0);
    }

}


/* =========================
   موبایل
========================= */

@media(max-width:600px) {

    .title {
        font-size: 45px;
    }

    #hacked h1 {
        font-size: 45px;
    }

    #percent {
        font-size: 40px;
    }

    #terminal {
        left: 10px;
        bottom: 10px;
        font-size: 11px;
    }

}

</style>
</head>


<body>


<!-- =========================
     صفحه اصلی
========================= -->

<section id="home">

    <div class="main-box">

        <h1 class="title">
            داش مبین
        </h1>

        <p class="subtitle">
            سیستم مخفی داش مبین
        </p>

        <button id="secretBtn">
            🔐 SECRET
        </button>

    </div>

</section>



<!-- =========================
     صفحه هکری
========================= -->

<section id="hackPage">

    <canvas id="matrix"></canvas>


    <div id="redFlash"></div>


    <div id="center">

        <div id="percent">
            0%
        </div>

        <div id="status">
            INITIALIZING...
        </div>

        <div class="progress-container">

            <div id="progress"></div>

        </div>

    </div>


    <!-- ترمینال -->

    <div id="terminal">

        <div class="terminal-line">
            &gt; connecting to server...
        </div>

        <div class="terminal-line">
            &gt; bypassing firewall...
        </div>

        <div class="terminal-line">
            &gt; accessing database...
        </div>

        <div class="terminal-line">
            &gt; downloading secrets...
        </div>

        <div class="terminal-line">
            &gt; system access granted...
        </div>

    </div>


    <!-- پیام نهایی -->

    <div id="hacked">

        <h1>
            YOU HACKED
        </h1>

        <div id="joke">
            😂 شوخی بود
        </div>

        <button id="back">
            ← برگشت
        </button>

    </div>

</section>



<script>

/* =====================================
   عناصر صفحه
===================================== */

const secretBtn =
    document.getElementById("secretBtn");

const home =
    document.getElementById("home");

const hackPage =
    document.getElementById("hackPage");

const percent =
    document.getElementById("percent");

const status =
    document.getElementById("status");

const progress =
    document.getElementById("progress");

const hacked =
    document.getElementById("hacked");

const joke =
    document.getElementById("joke");

const back =
    document.getElementById("back");

const redFlash =
    document.getElementById("redFlash");


/* =====================================
   صدای تایپ / بوق
===================================== */

let audioContext;

function beep() {

    try {

        if (!audioContext) {

            audioContext =
                new (window.AudioContext ||
                window.webkitAudioContext)();

        }

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.frequency.value =
            500 + Math.random() * 500;

        oscillator.type = "square";

        gain.gain.value = 0.025;

        oscillator.connect(gain);

        gain.connect(audioContext.destination);

        oscillator.start();

        oscillator.stop(
            audioContext.currentTime + 0.04
        );

    } catch(e) {}

}


/* =====================================
   شروع هک
===================================== */

secretBtn.addEventListener("click", () => {

    home.style.display = "none";

    hackPage.style.display = "block";

    startMatrix();

    startHack();

});


/* =====================================
   سیستم هک
===================================== */

function startHack() {

    let value = 0;

    const statuses = [

        "INITIALIZING...",
        "CONNECTING TO SERVER...",
        "BYPASSING FIREWALL...",
        "SEARCHING DATABASE...",
        "ACCESSING SYSTEM...",
        "DOWNLOADING FILES...",
        "DECRYPTING DATA...",
        "ACCESS GRANTED..."
    ];


    const interval = setInterval(() => {

        value++;

        percent.textContent =
            value + "%";

        progress.style.width =
            value + "%";


        const index =
            Math.floor(
                value /
                (100 / statuses.length)
            );

        status.textContent =
            statuses[
                Math.min(
                    index,
                    statuses.length - 1
                )
            ];


        beep();


        if (value >= 100) {

            clearInterval(interval);

            setTimeout(showHacked, 700);

        }

    }, 55);

}


/* =====================================
   نمایش YOU HACKED
===================================== */

function showHacked() {

    document.body.classList.add("shake");

    hacked.style.display = "flex";

    redFlash.style.opacity = "0.35";

    setTimeout(() => {

        redFlash.style.opacity = "0";

    }, 150);


    setTimeout(() => {

        joke.style.display = "block";

    }, 1800);


    setTimeout(() => {

        back.style.display = "block";

    }, 2800);

}


/* =====================================
   دکمه برگشت
===================================== */

back.addEventListener("click", () => {

    location.reload();

});


/* =====================================
   MATRIX
===================================== */

function startMatrix() {

    const canvas =
        document.getElementById("matrix");

    const ctx =
        canvas.getContext("2d");


    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;


    const characters =
        "010101010101010101010101010101010101010101";


    const fontSize = 18;

    const columns =
        Math.floor(
            canvas.width / fontSize
        );


    const drops = [];


    for (
        let i = 0;
        i < columns;
        i++
    ) {

        drops[i] =
            Math.random() *
            -100;

    }


    function drawMatrix() {

        ctx.fillStyle =
            "rgba(0,0,0,0.07)";

        ctx.fillRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


        ctx.fillStyle =
            "#00ff41";

        ctx.font =
            fontSize + "px monospace";


        for (
            let i = 0;
            i < drops.length;
            i++
        ) {

            const character =
                characters[
                    Math.floor(
                        Math.random() *
                        characters.length
                    )
                ];


            ctx.fillText(
                character,
                i * fontSize,
                drops[i] * fontSize
            );


            if (
                drops[i] * fontSize >
                canvas.height
                &&
                Math.random() > 0.975
            ) {

                drops[i] = 0;

            }


            drops[i]++;

        }

    }


    setInterval(
        drawMatrix,
        35
    );


    window.addEventListener(
        "resize",
        () => {

            canvas.width =
                window.innerWidth;

            canvas.height =
                window.innerHeight;

        }
    );

}

</script>

</body>
</html>
